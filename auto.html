<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://openrouter.ai; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Chạy tự động · Multi-AI House</title>
<link rel="stylesheet" href="./auto.css">
<script type="module" src="./auto.js"></script>
</head>
<body>
<main>
  <a href="./">← Multi-AI House</a>
  <h1>Giao việc cho hai AI</h1>
  <p>Gemma soạn bản nháp, Nemotron kiểm tra và trả bản hoàn chỉnh.</p>
  <form id="run">
    <label for="key">Khóa OpenRouter</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="key-help">
    <p id="key-help">Khóa chỉ dùng trong lần mở trang này. Yêu cầu và bản nháp được gửi trực tiếp tới OpenRouter. <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener noreferrer">Lấy khóa miễn phí ↗</a></p>
    <label for="brief">Việc cần làm</label>
    <textarea id="brief" rows="5" maxlength="6000" placeholder="Ví dụ: Viết kịch bản Mỡ kể chuyện, mở đầu 3 giây thu hút, kèm gợi ý âm thanh."></textarea>
    <div class="actions">
      <button id="start" type="submit">Chạy hai AI</button>
      <button id="retry" type="button" hidden>Chạy lại bước kiểm tra</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" hidden aria-labelledby="result-title">
    <h2 id="result-title">Kết quả</h2>
    <p id="saved-brief"></p>
    <pre id="final" hidden></pre>
    <details id="draft-panel">
      <summary>Bản nháp của Gemma</summary>
      <pre id="draft"></pre>
    </details>
  </section>
</main>
</body>
</html>
